- aid: deepgram:voice-agent-api
  name: Deepgram Voice Agent API
  tags:
  - Conversational AI
  - Real-Time
  - Voice Agent
  - Voice AI
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.deepgram.com
  humanURL: https://deepgram.com/product/voice-agent-api
  properties:
  - url: https://developers.deepgram.com/docs/voice-agent/getting-started
    type: Documentation
  - url: asyncapi/deepgram-voice-agent-asyncapi.yml
    type: AsyncAPI
  description: >-
    The Deepgram Voice Agent API is an end-to-end solution that combines speech-to-text, LLM orchestration,
    and text-to-speech into a single real-time API. It simplifies the development of conversational voice
    agents by eliminating the need to stitch together multiple services. The API includes built-in barge-in
    detection, turn-taking prediction, function calling, and mid-session control to ensure smooth, natural
    conversations without pauses or interruptions.
