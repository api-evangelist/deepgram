apis:
  - aid: deepgram:speech-to-text-api
    name: Deepgram Speech-to-Text API
    tags:
      - Speech-to-Text
      - Transcription
      - Audio
      - Speech Recognition
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://api.deepgram.com
    humanURL: https://developers.deepgram.com/docs/stt/getting-started
    properties:
      - url: https://developers.deepgram.com/docs/stt/getting-started
        type: Documentation
      - url: openapi/deepgram-speech-to-text-openapi.yml
        type: OpenAPI
      - url: asyncapi/deepgram-speech-to-text-asyncapi.yml
        type: AsyncAPI
    description: >-
      The Deepgram Speech-to-Text API provides accurate, fast transcription of
      audio content using advanced AI models. It supports both pre-recorded audio
      files and real-time streaming audio, delivering transcripts in under 300
      milliseconds. The API includes features such as punctuation, diarization,
      language detection, smart formatting, and support for multiple languages
      and audio formats. Deepgram's Nova model family powers the transcription
      engine, offering high accuracy for conversational and professional audio.
  - aid: deepgram:text-to-speech-api
    name: Deepgram Text-to-Speech API
    tags:
      - Text-to-Speech
      - Speech Synthesis
      - Audio
      - Voice
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://api.deepgram.com
    humanURL: https://developers.deepgram.com/reference/text-to-speech-api/speak
    properties:
      - url: https://developers.deepgram.com/reference/text-to-speech-api/speak
        type: Documentation
      - url: openapi/deepgram-text-to-speech-openapi.yml
        type: OpenAPI
      - url: asyncapi/deepgram-text-to-speech-asyncapi.yml
        type: AsyncAPI
    description: >-
      The Deepgram Text-to-Speech API converts text into natural-sounding speech
      using the Aura model family. It supports both single text requests and
      continuous streaming text-to-speech, delivering sub-200 millisecond
      latency suitable for real-time voice agents and conversational AI
      applications. The API offers multiple voice options and is designed for
      enterprise-grade deployments including voicebots, IVR systems, and
      interactive voice applications.
  - aid: deepgram:voice-agent-api
    name: Deepgram Voice Agent API
    tags:
      - Voice Agent
      - Conversational AI
      - Voice AI
      - Real-Time
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://api.deepgram.com
    humanURL: https://deepgram.com/product/voice-agent-api
    properties:
      - url: https://developers.deepgram.com/docs/voice-agent/getting-started
        type: Documentation
      - url: asyncapi/deepgram-voice-agent-asyncapi.yml
        type: AsyncAPI
    description: >-
      The Deepgram Voice Agent API is an end-to-end solution that combines
      speech-to-text, LLM orchestration, and text-to-speech into a single
      real-time API. It simplifies the development of conversational voice
      agents by eliminating the need to stitch together multiple services.
      The API includes built-in barge-in detection, turn-taking prediction,
      function calling, and mid-session control to ensure smooth, natural
      conversations without pauses or interruptions. It supports integration
      with multiple LLM providers for flexible voice agent development.
  - aid: deepgram:audio-intelligence-api
    name: Deepgram Audio Intelligence API
    tags:
      - Audio Intelligence
      - Sentiment Analysis
      - Summarization
      - Topic Detection
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://api.deepgram.com
    humanURL: https://developers.deepgram.com/docs/audio-intelligence
    properties:
      - url: https://developers.deepgram.com/docs/audio-intelligence
        type: Documentation
      - url: openapi/deepgram-speech-to-text-openapi.yml
        type: OpenAPI
    description: >-
      The Deepgram Audio Intelligence API provides advanced analysis capabilities
      for audio and text content. It offers features including sentiment
      analysis, summarization, topic detection, and intent recognition. These
      capabilities allow developers to extract structured insights from
      transcribed audio or text input, enabling use cases such as call center
      analytics, meeting summarization, and content categorization. The API
      works alongside Deepgram's transcription services to provide a complete
      audio understanding pipeline.
  - aid: deepgram:management-api
    name: Deepgram Management API
    tags:
      - Management
      - API Keys
      - Projects
      - Administration
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://api.deepgram.com
    humanURL: https://developers.deepgram.com/docs/create-additional-api-keys
    properties:
      - url: https://developers.deepgram.com/docs/create-additional-api-keys
        type: Documentation
      - url: openapi/deepgram-management-openapi.yml
        type: OpenAPI
    description: >-
      The Deepgram Management API allows developers to programmatically manage
      their Deepgram account resources. It provides endpoints for creating and
      managing API keys, configuring projects, managing team members, and
      monitoring usage. This API enables automation of administrative tasks
      and integration of Deepgram account management into existing workflows
      and infrastructure tooling.
