description: >-
  Deepgram is an enterprise voice AI platform that provides speech-to-text,
  text-to-speech, and voice agent APIs powered by advanced AI models. The
  platform offers real-time and batch transcription through its Nova model
  family, natural-sounding speech synthesis through its Aura model family,
  and an end-to-end Voice Agent API that combines STT, LLM orchestration,
  and TTS into a single real-time interface. Deepgram serves developers and
  enterprises building voice-enabled applications including conversational AI
  agents, call center analytics, transcription services, and accessibility
  tools, with a focus on low latency and high accuracy.
