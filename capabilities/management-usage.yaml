naftiko: 1.0.0-alpha2
info:
  label: Deepgram Management API — Usage
  description: 'Deepgram Management API — Usage. 2 operations. Lead operation: Deepgram List project requests. Self-contained
    Naftiko capability covering one Deepgram business surface.'
  tags:
  - Deepgram
  - Usage
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    DEEPGRAM_API_KEY: DEEPGRAM_API_KEY
capability:
  consumes:
  - type: http
    namespace: management-usage
    baseUri: https://api.deepgram.com
    description: Deepgram Management API — Usage business capability. Self-contained, no shared references.
    resources:
    - name: v1-projects-project_id-requests
      path: /v1/projects/{project_id}/requests
      operations:
      - name: listprojectrequests
        method: GET
        description: Deepgram List project requests
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: start
          in: query
          type: string
          description: Start date for the request period in ISO 8601 format.
        - name: end
          in: query
          type: string
          description: End date for the request period in ISO 8601 format.
        - name: limit
          in: query
          type: integer
          description: Maximum number of results to return per page.
        - name: cursor
          in: query
          type: string
          description: Pagination cursor for retrieving the next page of results.
    - name: v1-projects-project_id-usage
      path: /v1/projects/{project_id}/usage
      operations:
      - name: getprojectusage
        method: GET
        description: Deepgram Get project usage
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: start
          in: query
          type: string
          description: Start date for the usage period in ISO 8601 format.
        - name: end
          in: query
          type: string
          description: End date for the usage period in ISO 8601 format.
    authentication:
      type: bearer
      token: '{{env.DEEPGRAM_API_KEY}}'
  exposes:
  - type: rest
    namespace: management-usage-rest
    port: 8080
    description: REST adapter for Deepgram Management API — Usage. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/v1/projects/{project-id}/requests
      name: v1-projects-project-id-requests
      description: REST surface for v1-projects-project_id-requests.
      operations:
      - method: GET
        name: listprojectrequests
        description: Deepgram List project requests
        call: management-usage.listprojectrequests
        with:
          start: rest.start
          end: rest.end
          limit: rest.limit
          cursor: rest.cursor
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/projects/{project-id}/usage
      name: v1-projects-project-id-usage
      description: REST surface for v1-projects-project_id-usage.
      operations:
      - method: GET
        name: getprojectusage
        description: Deepgram Get project usage
        call: management-usage.getprojectusage
        with:
          start: rest.start
          end: rest.end
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: management-usage-mcp
    port: 9090
    transport: http
    description: MCP adapter for Deepgram Management API — Usage. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: deepgram-list-project-requests
      description: Deepgram List project requests
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: management-usage.listprojectrequests
      with:
        start: tools.start
        end: tools.end
        limit: tools.limit
        cursor: tools.cursor
      outputParameters:
      - type: object
        mapping: $.
    - name: deepgram-get-project-usage
      description: Deepgram Get project usage
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: management-usage.getprojectusage
      with:
        start: tools.start
        end: tools.end
      outputParameters:
      - type: object
        mapping: $.
