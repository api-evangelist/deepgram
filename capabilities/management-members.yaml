naftiko: 1.0.0-alpha2
info:
  label: Deepgram Management API — Members
  description: 'Deepgram Management API — Members. 2 operations. Lead operation: Deepgram List project members. Self-contained
    Naftiko capability covering one Deepgram business surface.'
  tags:
  - Deepgram
  - Members
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    DEEPGRAM_API_KEY: DEEPGRAM_API_KEY
capability:
  consumes:
  - type: http
    namespace: management-members
    baseUri: https://api.deepgram.com
    description: Deepgram Management API — Members business capability. Self-contained, no shared references.
    resources:
    - name: v1-projects-project_id-members
      path: /v1/projects/{project_id}/members
      operations:
      - name: listprojectmembers
        method: GET
        description: Deepgram List project members
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v1-projects-project_id-members-member_id
      path: /v1/projects/{project_id}/members/{member_id}
      operations:
      - name: removeprojectmember
        method: DELETE
        description: Deepgram Remove a project member
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.DEEPGRAM_API_KEY}}'
  exposes:
  - type: rest
    namespace: management-members-rest
    port: 8080
    description: REST adapter for Deepgram Management API — Members. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/v1/projects/{project-id}/members
      name: v1-projects-project-id-members
      description: REST surface for v1-projects-project_id-members.
      operations:
      - method: GET
        name: listprojectmembers
        description: Deepgram List project members
        call: management-members.listprojectmembers
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/projects/{project-id}/members/{member-id}
      name: v1-projects-project-id-members-member-id
      description: REST surface for v1-projects-project_id-members-member_id.
      operations:
      - method: DELETE
        name: removeprojectmember
        description: Deepgram Remove a project member
        call: management-members.removeprojectmember
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: management-members-mcp
    port: 9090
    transport: http
    description: MCP adapter for Deepgram Management API — Members. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: deepgram-list-project-members
      description: Deepgram List project members
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: management-members.listprojectmembers
      outputParameters:
      - type: object
        mapping: $.
    - name: deepgram-remove-project-member
      description: Deepgram Remove a project member
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: management-members.removeprojectmember
      outputParameters:
      - type: object
        mapping: $.
