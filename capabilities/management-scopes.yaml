naftiko: 1.0.0-alpha2
info:
  label: Deepgram Management API — Scopes
  description: 'Deepgram Management API — Scopes. 2 operations. Lead operation: Deepgram Get member scopes. Self-contained
    Naftiko capability covering one Deepgram business surface.'
  tags:
  - Deepgram
  - Scopes
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    DEEPGRAM_API_KEY: DEEPGRAM_API_KEY
capability:
  consumes:
  - type: http
    namespace: management-scopes
    baseUri: https://api.deepgram.com
    description: Deepgram Management API — Scopes business capability. Self-contained, no shared references.
    resources:
    - name: v1-projects-project_id-members-member_id-scopes
      path: /v1/projects/{project_id}/members/{member_id}/scopes
      operations:
      - name: getmemberscopes
        method: GET
        description: Deepgram Get member scopes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatememberscopes
        method: PUT
        description: Deepgram Update member scopes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.DEEPGRAM_API_KEY}}'
  exposes:
  - type: rest
    namespace: management-scopes-rest
    port: 8080
    description: REST adapter for Deepgram Management API — Scopes. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/v1/projects/{project-id}/members/{member-id}/scopes
      name: v1-projects-project-id-members-member-id-scopes
      description: REST surface for v1-projects-project_id-members-member_id-scopes.
      operations:
      - method: GET
        name: getmemberscopes
        description: Deepgram Get member scopes
        call: management-scopes.getmemberscopes
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updatememberscopes
        description: Deepgram Update member scopes
        call: management-scopes.updatememberscopes
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: management-scopes-mcp
    port: 9090
    transport: http
    description: MCP adapter for Deepgram Management API — Scopes. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: deepgram-get-member-scopes
      description: Deepgram Get member scopes
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: management-scopes.getmemberscopes
      outputParameters:
      - type: object
        mapping: $.
    - name: deepgram-update-member-scopes
      description: Deepgram Update member scopes
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: management-scopes.updatememberscopes
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
