openapi: 3.2.0
info:
  title: REST Scopes API
  version: 1.0.0
servers:
- url: https://agent.deepgram.com
  description: Production
- url: https://api.deepgram.com
  description: Base
tags:
- name: Scopes
paths:
  /v1/projects/{project_id}/members/{member_id}/scopes:
    get:
      operationId: scopes_list
      summary: List Project Member Scopes
      description: Retrieves a list of scopes for a specific member
      tags:
      - Scopes
      parameters:
      - name: project_id
        in: path
        description: The unique identifier of the project
        required: true
        schema:
          type: string
      - name: member_id
        in: path
        description: The unique identifier of the Member
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A list of scopes for a specific member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProjectMemberScopesV1Response'
        '400':
          description: Invalid Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - ApiKeyAuth: []
    put:
      operationId: scopes_update
      summary: Update Project Member Scopes
      description: Updates the scopes for a specific member
      tags:
      - Scopes
      parameters:
      - name: project_id
        in: path
        description: The unique identifier of the project
        required: true
        schema:
          type: string
      - name: member_id
        in: path
        description: The unique identifier of the Member
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Updated the scopes for a specific member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateProjectMemberScopesV1Response'
        '400':
          description: Invalid Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        description: A scope to update
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectMemberScopesV1Request'
      security:
      - ApiKeyAuth: []
components:
  schemas:
    UpdateProjectMemberScopesV1Request:
      type: object
      properties:
        scope:
          type: string
          description: A scope to update
      required:
      - scope
      title: UpdateProjectMemberScopesV1Request
    ErrorResponseTextError:
      type: string
      title: ErrorResponseTextError
    UpdateProjectMemberScopesV1Response:
      type: object
      properties:
        message:
          type: string
          description: confirmation message
      title: UpdateProjectMemberScopesV1Response
    ListProjectMemberScopesV1Response:
      type: object
      properties:
        scopes:
          type: array
          items:
            type: string
          description: The API scopes of the member
      title: ListProjectMemberScopesV1Response
    ErrorResponseLegacyError:
      type: object
      properties:
        err_code:
          type: string
          description: The error code
        err_msg:
          type: string
          description: The error message
        request_id:
          type: string
          description: The request ID
      title: ErrorResponseLegacyError
    ErrorResponse:
      oneOf:
      - $ref: '#/components/schemas/ErrorResponseTextError'
      - $ref: '#/components/schemas/ErrorResponseLegacyError'
      - $ref: '#/components/schemas/ErrorResponseModernError'
      title: ErrorResponse
    ErrorResponseModernError:
      type: object
      properties:
        category:
          type: string
          description: The category of the error
        message:
          type: string
          description: A message about the error
        details:
          type: string
          description: A description of the error
        request_id:
          type: string
          description: The unique identifier of the request
      title: ErrorResponseModernError
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Use `Authorization: Token <API_KEY>`

        Example: `Authorization: Token 12345abcdef`

        '
    JwtAuth:
      type: http
      scheme: bearer
      description: 'Use `Authorization: Bearer <JWT>`

        Example: `Authorization: Bearer eyJhbGciOiJ...`

        '
x-provenance:
  method: harvested
  publisher: Deepgram
  source: https://developers.deepgram.com/openapi.json
