openapi: 3.2.0
info:
  title: REST Projects API
  version: 1.0.0
servers:
- url: https://agent.deepgram.com
  description: Production
- url: https://api.deepgram.com
  description: Base
tags:
- name: Projects
paths:
  /v1/projects:
    get:
      operationId: projects_list
      summary: List Projects
      description: Retrieves basic information about the projects associated with the API key
      tags:
      - Projects
      responses:
        '200':
          description: A list of projects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProjectsV1Response'
        '400':
          description: Invalid Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - ApiKeyAuth: []
  /v1/projects/{project_id}:
    get:
      operationId: projects_get
      summary: Get a Project
      description: Retrieves information about the specified project
      tags:
      - Projects
      parameters:
      - name: project_id
        in: path
        description: The unique identifier of the project
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: Number of results to return per page. Default 10. Range [1,1000]
        required: false
        schema:
          type: number
          format: double
          minimum: 1
          maximum: 1000
          default: 10
      - name: page
        in: query
        description: Navigate and return the results to retrieve specific portions of information of the response
        required: false
        schema:
          type: number
          format: double
      responses:
        '200':
          description: A project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProjectV1Response'
        '400':
          description: Invalid Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - ApiKeyAuth: []
    patch:
      operationId: projects_update
      summary: Update a Project
      description: Updates the name or other properties of an existing project
      tags:
      - Projects
      parameters:
      - name: project_id
        in: path
        description: The unique identifier of the project
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateProjectV1Response'
        '400':
          description: Invalid Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        description: The name of the project
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectV1Request'
      security:
      - ApiKeyAuth: []
    delete:
      operationId: projects_delete
      summary: Delete a Project
      description: Deletes the specified project
      tags:
      - Projects
      parameters:
      - name: project_id
        in: path
        description: The unique identifier of the project
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteProjectV1Response'
        '400':
          description: Invalid Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - ApiKeyAuth: []
  /v1/projects/{project_id}/leave:
    delete:
      operationId: projects_leave
      summary: Leave a Project
      description: Removes the authenticated account from the specific project
      tags:
      - Projects
      parameters:
      - name: project_id
        in: path
        description: The unique identifier of the project
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successfully removed account from project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveProjectV1Response'
        '400':
          description: Invalid Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - ApiKeyAuth: []
components:
  schemas:
    ListProjectsV1Response:
      type: object
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/ListProjectsV1ResponseProjectsItems'
      title: ListProjectsV1Response
    DeleteProjectV1Response:
      type: object
      properties:
        message:
          type: string
          description: Confirmation message
      title: DeleteProjectV1Response
    GetProjectV1Response:
      type: object
      properties:
        project_id:
          type: string
          description: The unique identifier of the project
        mip_opt_out:
          type: boolean
          description: Model Improvement Program opt-out
        name:
          type: string
          description: The name of the project
      title: GetProjectV1Response
    ErrorResponseTextError:
      type: string
      title: ErrorResponseTextError
    ErrorResponseLegacyError:
      type: object
      properties:
        err_code:
          type: string
          description: The error code
        err_msg:
          type: string
          description: The error message
        request_id:
          type: string
          description: The request ID
      title: ErrorResponseLegacyError
    LeaveProjectV1Response:
      type: object
      properties:
        message:
          type: string
          description: confirmation message
      title: LeaveProjectV1Response
    UpdateProjectV1Request:
      type: object
      properties:
        name:
          type: string
          description: The name of the project
      title: UpdateProjectV1Request
    ErrorResponse:
      oneOf:
      - $ref: '#/components/schemas/ErrorResponseTextError'
      - $ref: '#/components/schemas/ErrorResponseLegacyError'
      - $ref: '#/components/schemas/ErrorResponseModernError'
      title: ErrorResponse
    ErrorResponseModernError:
      type: object
      properties:
        category:
          type: string
          description: The category of the error
        message:
          type: string
          description: A message about the error
        details:
          type: string
          description: A description of the error
        request_id:
          type: string
          description: The unique identifier of the request
      title: ErrorResponseModernError
    UpdateProjectV1Response:
      type: object
      properties:
        message:
          type: string
          description: confirmation message
      title: UpdateProjectV1Response
    ListProjectsV1ResponseProjectsItems:
      type: object
      properties:
        project_id:
          type: string
          description: The unique identifier of the project
        name:
          type: string
          description: The name of the project
      title: ListProjectsV1ResponseProjectsItems
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Use `Authorization: Token <API_KEY>`

        Example: `Authorization: Token 12345abcdef`

        '
    JwtAuth:
      type: http
      scheme: bearer
      description: 'Use `Authorization: Bearer <JWT>`

        Example: `Authorization: Bearer eyJhbGciOiJ...`

        '
