openapi: 3.2.0
info:
  title: REST Distribution Credentials API
  version: 1.0.0
servers:
- url: https://agent.deepgram.com
  description: Production
- url: https://api.deepgram.com
  description: Base
tags:
- name: distributionCredentials
paths:
  /v1/projects/{project_id}/self-hosted/distribution/credentials:
    get:
      operationId: distributionCredentials_list
      summary: List Project Self-Hosted Distribution Credentials
      description: Lists sets of distribution credentials for the specified project
      tags:
      - distributionCredentials
      parameters:
      - name: project_id
        in: path
        description: The unique identifier of the project
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A list of distribution credentials for a specific project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProjectDistributionCredentialsV1Response'
        '400':
          description: Invalid Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - ApiKeyAuth: []
    post:
      operationId: distributionCredentials_create
      summary: Create a Project Self-Hosted Distribution Credential
      description: Creates a set of distribution credentials for the specified project
      tags:
      - distributionCredentials
      parameters:
      - name: project_id
        in: path
        description: The unique identifier of the project
        required: true
        schema:
          type: string
      - name: scopes
        in: query
        description: List of permission scopes for the credentials
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/V1ProjectsProjectIdSelfHostedDistributionCredentialsPostParametersScopesSchemaItems'
          default:
          - self-hosted:products
      - name: provider
        in: query
        description: The provider of the distribution service
        required: false
        schema:
          $ref: '#/components/schemas/V1ProjectsProjectIdSelfHostedDistributionCredentialsPostParametersProvider'
          default: quay
      responses:
        '200':
          description: Single distribution credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProjectDistributionCredentialsV1Response'
        '400':
          description: Invalid Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        description: The set of distribution credentials to create
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectDistributionCredentialsV1Request'
      security:
      - ApiKeyAuth: []
  /v1/projects/{project_id}/self-hosted/distribution/credentials/{distribution_credentials_id}:
    get:
      operationId: distributionCredentials_get
      summary: Get a Project Self-Hosted Distribution Credential
      description: Returns a set of distribution credentials for the specified project
      tags:
      - distributionCredentials
      parameters:
      - name: project_id
        in: path
        description: The unique identifier of the project
        required: true
        schema:
          type: string
      - name: distribution_credentials_id
        in: path
        description: The UUID of the distribution credentials
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Single distribution credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProjectDistributionCredentialsV1Response'
        '400':
          description: Invalid Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - ApiKeyAuth: []
    delete:
      operationId: distributionCredentials_delete
      summary: Delete a Project Self-Hosted Distribution Credential
      description: Deletes a set of distribution credentials for the specified project
      tags:
      - distributionCredentials
      parameters:
      - name: project_id
        in: path
        description: The unique identifier of the project
        required: true
        schema:
          type: string
      - name: distribution_credentials_id
        in: path
        description: The UUID of the distribution credentials
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Single distribution credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProjectDistributionCredentialsV1Response'
        '400':
          description: Invalid Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - ApiKeyAuth: []
components:
  schemas:
    ErrorResponseTextError:
      type: string
      title: ErrorResponseTextError
    GetProjectDistributionCredentialsV1ResponseMember:
      type: object
      properties:
        member_id:
          type: string
          format: uuid
          description: Unique identifier for the member
        email:
          type: string
          format: email
          description: Email address of the member
      required:
      - member_id
      - email
      title: GetProjectDistributionCredentialsV1ResponseMember
    GetProjectDistributionCredentialsV1ResponseDistributionCredentials:
      type: object
      properties:
        distribution_credentials_id:
          type: string
          format: uuid
          description: Unique identifier for the distribution credentials
        provider:
          type: string
          description: The provider of the distribution service
        comment:
          type: string
          description: Optional comment about the credentials
        scopes:
          type: array
          items:
            type: string
          description: List of permission scopes for the credentials
        created:
          type: string
          format: date-time
          description: Timestamp when the credentials were created
      required:
      - distribution_credentials_id
      - provider
      - scopes
      - created
      title: GetProjectDistributionCredentialsV1ResponseDistributionCredentials
    ErrorResponseLegacyError:
      type: object
      properties:
        err_code:
          type: string
          description: The error code
        err_msg:
          type: string
          description: The error message
        request_id:
          type: string
          description: The request ID
      title: ErrorResponseLegacyError
    ListProjectDistributionCredentialsV1ResponseDistributionCredentialsItemsMember:
      type: object
      properties:
        member_id:
          type: string
          format: uuid
          description: Unique identifier for the member
        email:
          type: string
          format: email
          description: Email address of the member
      required:
      - member_id
      - email
      title: ListProjectDistributionCredentialsV1ResponseDistributionCredentialsItemsMember
    CreateProjectDistributionCredentialsV1ResponseDistributionCredentials:
      type: object
      properties:
        distribution_credentials_id:
          type: string
          format: uuid
          description: Unique identifier for the distribution credentials
        provider:
          type: string
          description: The provider of the distribution service
        comment:
          type: string
          description: Optional comment about the credentials
        scopes:
          type: array
          items:
            type: string
          description: List of permission scopes for the credentials
        created:
          type: string
          format: date-time
          description: Timestamp when the credentials were created
      required:
      - distribution_credentials_id
      - provider
      - scopes
      - created
      title: CreateProjectDistributionCredentialsV1ResponseDistributionCredentials
    CreateProjectDistributionCredentialsV1ResponseMember:
      type: object
      properties:
        member_id:
          type: string
          format: uuid
          description: Unique identifier for the member
        email:
          type: string
          format: email
          description: Email address of the member
      required:
      - member_id
      - email
      title: CreateProjectDistributionCredentialsV1ResponseMember
    ErrorResponse:
      oneOf:
      - $ref: '#/components/schemas/ErrorResponseTextError'
      - $ref: '#/components/schemas/ErrorResponseLegacyError'
      - $ref: '#/components/schemas/ErrorResponseModernError'
      title: ErrorResponse
    V1ProjectsProjectIdSelfHostedDistributionCredentialsPostParametersProvider:
      type: string
      enum:
      - quay
      default: quay
      title: V1ProjectsProjectIdSelfHostedDistributionCredentialsPostParametersProvider
    ListProjectDistributionCredentialsV1ResponseDistributionCredentialsItems:
      type: object
      properties:
        member:
          $ref: '#/components/schemas/ListProjectDistributionCredentialsV1ResponseDistributionCredentialsItemsMember'
        distribution_credentials:
          $ref: '#/components/schemas/ListProjectDistributionCredentialsV1ResponseDistributionCredentialsItemsDistributionCredentials'
      required:
      - member
      - distribution_credentials
      title: ListProjectDistributionCredentialsV1ResponseDistributionCredentialsItems
    ErrorResponseModernError:
      type: object
      properties:
        category:
          type: string
          description: The category of the error
        message:
          type: string
          description: A message about the error
        details:
          type: string
          description: A description of the error
        request_id:
          type: string
          description: The unique identifier of the request
      title: ErrorResponseModernError
    GetProjectDistributionCredentialsV1Response:
      type: object
      properties:
        member:
          $ref: '#/components/schemas/GetProjectDistributionCredentialsV1ResponseMember'
        distribution_credentials:
          $ref: '#/components/schemas/GetProjectDistributionCredentialsV1ResponseDistributionCredentials'
      required:
      - member
      - distribution_credentials
      title: GetProjectDistributionCredentialsV1Response
    ListProjectDistributionCredentialsV1Response:
      type: object
      properties:
        distribution_credentials:
          type: array
          items:
            $ref: '#/components/schemas/ListProjectDistributionCredentialsV1ResponseDistributionCredentialsItems'
          description: Array of distribution credentials with associated member information
      title: ListProjectDistributionCredentialsV1Response
    CreateProjectDistributionCredentialsV1Response:
      type: object
      properties:
        member:
          $ref: '#/components/schemas/CreateProjectDistributionCredentialsV1ResponseMember'
        distribution_credentials:
          $ref: '#/components/schemas/CreateProjectDistributionCredentialsV1ResponseDistributionCredentials'
      required:
      - member
      - distribution_credentials
      title: CreateProjectDistributionCredentialsV1Response
    V1ProjectsProjectIdSelfHostedDistributionCredentialsPostParametersScopesSchemaItems:
      type: string
      enum:
      - self-hosted:products
      - self-hosted:product:api
      - self-hosted:product:engine
      - self-hosted:product:license-proxy
      - self-hosted:product:dgtools
      - self-hosted:product:billing
      - self-hosted:product:hotpepper
      - self-hosted:product:metrics-server
      title: V1ProjectsProjectIdSelfHostedDistributionCredentialsPostParametersScopesSchemaItems
    ListProjectDistributionCredentialsV1ResponseDistributionCredentialsItemsDistributionCredentials:
      type: object
      properties:
        distribution_credentials_id:
          type: string
          format: uuid
          description: Unique identifier for the distribution credentials
        provider:
          type: string
          description: The provider of the distribution service
        comment:
          type: string
          description: Optional comment about the credentials
        scopes:
          type: array
          items:
            type: string
          description: List of permission scopes for the credentials
        created:
          type: string
          format: date-time
          description: Timestamp when the credentials were created
      required:
      - distribution_credentials_id
      - provider
      - scopes
      - created
      title: ListProjectDistributionCredentialsV1ResponseDistributionCredentialsItemsDistributionCredentials
    CreateProjectDistributionCredentialsV1Request:
      type: object
      properties:
        comment:
          type: string
          description: Optional comment about the credentials
      description: Request body for creating distribution credentials
      title: CreateProjectDistributionCredentialsV1Request
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Use `Authorization: Token <API_KEY>`

        Example: `Authorization: Token 12345abcdef`

        '
    JwtAuth:
      type: http
      scheme: bearer
      description: 'Use `Authorization: Bearer <JWT>`

        Example: `Authorization: Bearer eyJhbGciOiJ...`

        '
