openapi: 3.2.0
info:
  title: REST Audio API
  version: 1.0.0
servers:
- url: https://agent.deepgram.com
  description: Production
- url: https://api.deepgram.com
  description: Base
tags:
- name: Audio
paths:
  /v1/speak:
    post:
      operationId: audio_generate
      summary: Text to Speech transformation
      description: Convert text into natural-sounding speech using Deepgram's TTS REST API
      tags:
      - Audio
      parameters:
      - name: callback
        in: query
        description: URL to which we'll make the callback request
        required: false
        schema:
          type: string
      - name: callback_method
        in: query
        description: HTTP method by which the callback request will be made
        required: false
        schema:
          $ref: '#/components/schemas/V1SpeakPostParametersCallbackMethod'
          default: POST
      - name: mip_opt_out
        in: query
        description: Opts out requests from the Deepgram Model Improvement Program. Refer to our Docs for pricing impacts before setting this to true. https://dpgr.am/deepgram-mip
        required: false
        schema:
          type: boolean
          default: false
      - name: tag
        in: query
        description: Label your requests for the purpose of identification during usage reporting
        required: false
        schema:
          $ref: '#/components/schemas/V1SpeakPostParametersTag'
      - name: bit_rate
        in: query
        description: The bitrate of the audio in bits per second. Choose from predefined ranges or specific values based on the encoding type.
        required: false
        schema:
          $ref: '#/components/schemas/V1SpeakPostParametersBitRate'
          default: 48000
      - name: container
        in: query
        description: Container specifies the file format wrapper for the output audio. The available options depend on the encoding type.
        required: false
        schema:
          $ref: '#/components/schemas/V1SpeakPostParametersContainer'
          default: wav
      - name: encoding
        in: query
        description: Encoding allows you to specify the expected encoding of your audio output
        required: false
        schema:
          $ref: '#/components/schemas/V1SpeakPostParametersEncoding'
          default: mp3
      - name: model
        in: query
        description: AI model used to process submitted text
        required: false
        schema:
          $ref: '#/components/schemas/V1SpeakPostParametersModel'
          default: aura-asteria-en
      - name: sample_rate
        in: query
        description: Sample Rate specifies the sample rate for the output audio. Based on the encoding, different sample rates are supported. For some encodings, the sample rate is not configurable
        required: false
        schema:
          $ref: '#/components/schemas/V1SpeakPostParametersSampleRate'
          default: 24000
      - name: speed
        in: query
        description: Speaking rate multiplier that adjusts the pace of generated speech while preserving natural prosody and voice quality. Not yet supported in all languages.
        required: false
        schema:
          type: number
          format: double
          minimum: 0.7
          maximum: 1.5
          default: 1
      responses:
        '200':
          description: Successful text-to-speech transformation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/speak_v1_audio_generate_Response_200'
        '400':
          description: Invalid Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        description: Transform text to speech
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeakV1Request'
      security:
      - ApiKeyAuth: []
  /v2/speak:
    post:
      operationId: audio_generate_2
      summary: Flux Text to Speech (batch)
      description: Synthesize a complete block of text into a single audio response using Deepgram's Flux TTS batch (REST) API. Use this for pre-rendering fixed audio (IVR prompts, notifications, narration) where the whole text is known up front and you don't need incremental playback or interruption.
      tags:
      - Audio
      parameters:
      - name: callback
        in: query
        description: URL to which we'll make the callback request
        required: false
        schema:
          type: string
      - name: callback_method
        in: query
        description: HTTP method by which the callback request will be made
        required: false
        schema:
          $ref: '#/components/schemas/V2SpeakPostParametersCallbackMethod'
          default: POST
      - name: mip_opt_out
        in: query
        description: Opts out requests from the Deepgram Model Improvement Program. Refer to our Docs for pricing impacts before setting this to true. https://dpgr.am/deepgram-mip
        required: false
        schema:
          type: boolean
          default: false
      - name: tag
        in: query
        description: Label your requests for the purpose of identification during usage reporting
        required: false
        schema:
          $ref: '#/components/schemas/V2SpeakPostParametersTag'
      - name: bit_rate
        in: query
        description: The bitrate of the audio in bits per second. Choose from predefined ranges or specific values based on the encoding type.
        required: false
        schema:
          $ref: '#/components/schemas/V2SpeakPostParametersBitRate'
          default: 48000
      - name: container
        in: query
        description: Container specifies the file format wrapper for the output audio. The available options depend on the encoding type.
        required: false
        schema:
          $ref: '#/components/schemas/V2SpeakPostParametersContainer'
          default: wav
      - name: encoding
        in: query
        description: Encoding allows you to specify the expected encoding of your audio output
        required: false
        schema:
          $ref: '#/components/schemas/V2SpeakPostParametersEncoding'
          default: mp3
      - name: expressivity
        in: query
        description: 'Expressive range of the generated speech, on a calm-to-animated axis. Accepted values: `-2`, `-1`, `0`, `1`, `2`. `0` (the default) is the voice''s tuned delivery and the production-validated setting, with `-2` the calm end of the range and `2` the animated end. Supported on all Flux voices; applies to the whole request. Beta: behavior may change in future model versions, and non-default values increase the risk of hallucinations and pronunciation errors; audition before shipping. An invalid value is rejected with a `400` — `EXPRESSIVITY_OUT_OF_RANGE` for a value outside the range, `EXPRESSIVITY_INCREMENT_INVALID` for a fractional value. See [Expressivity](/docs/tts-expressivity).'
        required: false
        schema:
          $ref: '#/components/schemas/V2SpeakPostParametersExpressivity'
          default: 0
      - name: model
        in: query
        description: Flux TTS model used to synthesize the submitted text, in the form `flux-{voice}-{language}` (for example, `flux-alexis-en`). Required; unlike the v1 (Aura) endpoint there is no default and only flux models are accepted. English-only at launch.
        required: true
        schema:
          type: string
      - name: sample_rate
        in: query
        description: Sample Rate specifies the sample rate for the output audio. Based on the encoding, different sample rates are supported. For some encodings, the sample rate is not configurable
        required: false
        schema:
          $ref: '#/components/schemas/V2SpeakPostParametersSampleRate'
          default: 24000
      - name: speed
        in: query
        description: Speaking rate multiplier that adjusts the pace of generated speech while preserving natural prosody and voice quality. Accepted values run `0.5` to `1.5` in `0.05` increments. Not yet supported in all languages. When the text contains an inline pause marker, speed is capped at `1.15` (`PAUSE_SPEED_CAP_EXCEEDED` above that). A value other than `1.0` cannot be combined with inline pronunciation controls (`CONTROL_COMBINATION_INVALID`).
        required: false
        schema:
          type: number
          format: double
          minimum: 0.5
          maximum: 1.5
          multipleOf: 0.05
          default: 1
      - name: priority
        in: query
        description: Processing priority for asynchronous (callback) requests. The only supported value is low.
        required: false
        schema:
          $ref: '#/components/schemas/V2SpeakPostParametersPriority'
      responses:
        '200':
          description: 'Returns the synthesized audio in the requested encoding as a binary stream. When a `callback` URL is supplied, the request is processed asynchronously and the response body is instead a JSON acknowledgement (Content-Type `application/json`) of the form {"request_id": "..."}, with the audio delivered to the callback URL. Because this endpoint is typed as a binary audio stream, SDK callers that set `callback` receive this JSON acknowledgement through the audio byte iterator as raw bytes and must join the chunks and parse `request_id` themselves.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeakV2AcceptedResponse'
        '400':
          description: 'Invalid Request. Inline control violations return a structured error whose `err_code` names the rule: `CONTROL_COMBINATION_INVALID` (pronunciation combined with speed or pause, or all three together), `PAUSE_SPEED_CAP_EXCEEDED` (a pause marker with `speed` above `1.15`), `BREAK_OUT_OF_RANGE` (a pause outside 500-3000 ms), `BREAK_INCREMENT_INVALID` (a pause off the 100 ms grid), `BREAKS_LIMIT_EXCEEDED` (more than 8 pause markers, or two pauses with no text between them), `BREAK_SYNTAX_INVALID` (a malformed pause marker, such as a simple marker without backslashes or an escaped structured marker), plus the existing pronunciation and speed codes. A `speed` of `1.0` does not count as a speed control for the combination rules. See [Speed, Pause, Pronunciation](/docs/tts-voice-controls).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        description: Transform text to speech
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeakV2Request'
      security:
      - ApiKeyAuth: []
