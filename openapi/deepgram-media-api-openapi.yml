      title: SharedSentiments
    V1ListenPostParametersRedact1:
      type: array
      items:
        $ref: '#/components/schemas/V1ListenPostParametersRedactSchemaOneOf1Items'
      title: V1ListenPostParametersRedact1
    V1ListenPostParametersKeywords:
      oneOf:
      - type: string
      - type: array
        items:
          type: string
      title: V1ListenPostParametersKeywords
    ListenV1ResponseMetadataModelInfo:
      type: object
      properties: {}
      title: ListenV1ResponseMetadataModelInfo
    V1ListenPostParametersCustomIntentMode:
      type: string
      enum:
      - extended
      - strict
      default: extended
      title: V1ListenPostParametersCustomIntentMode
    V1ListenPostParametersDetectLanguage:
      oneOf:
      - type: boolean
        default: false
      - type: array
        items:
          type: string
      title: V1ListenPostParametersDetectLanguage
    SharedIntentsSegmentsItemsIntentsItems:
      type: object
      properties:
        intent:
          type: string
        confidence_score:
          type: string
          title: float
      title: SharedIntentsSegmentsItemsIntentsItems
    ListenV1ResponseMetadataSentimentInfo:
      type: object
      properties:
        model_uuid:
          type: string
        input_tokens:
          type: integer
        output_tokens:
          type: integer
      title: ListenV1ResponseMetadataSentimentInfo
    V1ListenPostParametersEncoding:
      type: string
      enum:
      - linear16
      - flac
      - mulaw
      - amr-nb
      - amr-wb
      - opus
      - speex
      - g729
      title: V1ListenPostParametersEncoding
    SharedIntents:
      type: object
      properties:
        segments:
          type: array
          items:
            $ref: '#/components/schemas/SharedIntentsSegmentsItems'
      description: Output whenever `intents=true` is used
      title: SharedIntents
    V1ListenPostParametersModel0:
      type: string
      enum:
      - nova-3
      - nova-3-general
      - nova-3-medical
      - nova-2
      - nova-2-general
      - nova-2-meeting
      - nova-2-finance
      - nova-2-conversationalai
      - nova-2-voicemail
      - nova-2-video
      - nova-2-medical
      - nova-2-drivethru
      - nova-2-automotive
      - nova
      - nova-general
      - nova-phonecall
      - nova-medical
      - enhanced
      - enhanced-general
      - enhanced-meeting
      - enhanced-phonecall
      - enhanced-finance
      - base
      - meeting
      - phonecall
      - finance
      - conversationalai
      - voicemail
      - video
      description: Our public models available to all accounts
      title: V1ListenPostParametersModel0
    ListenV1ResponseResultsChannels:
      type: array
      items:
        $ref: '#/components/schemas/ListenV1ResponseResultsChannelsItems'
      title: ListenV1ResponseResultsChannels
    ListenV1ResponseResultsUtterancesItems:
      type: object
      properties:
        start:
          type: string
          title: float
        end:
          type: string
          title: float
        confidence:
          type: string
          title: float
        channel:
          type: integer
        transcript:
          type: string
        words:
          type: array
          items:
            $ref: '#/components/schemas/ListenV1ResponseResultsUtterancesItemsWordsItems'
        speaker:
          type: integer
        id:
          type: string
          format: uuid
      title: ListenV1ResponseResultsUtterancesItems
    V1ListenPostParametersTag:
      oneOf:
      - type: string
      - type: array
        items:
          type: string
      title: V1ListenPostParametersTag
    V1ListenPostParametersVersion:
      oneOf:
      - $ref: '#/components/schemas/V1ListenPostParametersVersion0'
      - type: string
      title: V1ListenPostParametersVersion
    ListenV1ResponseResultsChannelsItemsAlternativesItemsParagraphsParagraphsItems:
      type: object
      properties:
        sentences:
          type: array
          items:
            $ref: '#/components/schemas/ListenV1ResponseResultsChannelsItemsAlternativesItemsParagraphsParagraphsItemsSentencesItems'
        speaker:
          type: integer
        num_words:
          type: integer
        start:
          type: string
          title: float
        end:
          type: string
          title: float
      title: ListenV1ResponseResultsChannelsItemsAlternativesItemsParagraphsParagraphsItems
    ListenV1ResponseMetadataDiarizeInfo:
      type: object
      properties:
        model_uuid:
          type: string
          description: The diarizer model UUID
        arch:
          type: string
          description: The diarizer arch, such as `v1` or `v2`
      required:
      - model_uuid
      - arch
      description: The diarizer that produced the speaker labels. Present only when a diarizer ran.
      title: ListenV1ResponseMetadataDiarizeInfo
    SharedSentimentsSegmentsItems:
      type: object
      properties:
