    V1ListenPostParametersModel:
      oneOf:
      - $ref: '#/components/schemas/V1ListenPostParametersModel0'
      - type: string
      title: V1ListenPostParametersModel
    ListenV1ResponseResultsChannelsItems:
      type: object
      properties:
