    ListenV1ResponseResultsChannelsItemsSearchItems:
      type: object
      properties:
        query:
          type: string
        hits:
          type: array
          items:
            $ref: '#/components/schemas/ListenV1ResponseResultsChannelsItemsSearchItemsHitsItems'
      title: ListenV1ResponseResultsChannelsItemsSearchItems
    V1ListenPostParametersExtra:
      oneOf:
      - type: string
      - type: array
        items:
          type: string
      title: V1ListenPostParametersExtra
    SharedIntentsSegmentsItems:
      type: object
      properties:
        text:
          type: string
        start_word:
          type: number
          format: double
        end_word:
          type: number
          format: double
        intents:
          type: array
          items:
            $ref: '#/components/schemas/SharedIntentsSegmentsItemsIntentsItems'
      title: SharedIntentsSegmentsItems
    ListenV1ResponseResultsChannelsItemsAlternativesItems:
      type: object
      properties:
        transcript:
          type: string
        confidence:
          type: string
          title: float
        words:
          type: array
          items:
            $ref: '#/components/schemas/ListenV1ResponseResultsChannelsItemsAlternativesItemsWordsItems'
        paragraphs:
          $ref: '#/components/schemas/ListenV1ResponseResultsChannelsItemsAlternativesItemsParagraphs'
        entities:
          type: array
          items:
            $ref: '#/components/schemas/ListenV1ResponseResultsChannelsItemsAlternativesItemsEntitiesItems'
        summaries:
          type: array
          items:
            $ref: '#/components/schemas/ListenV1ResponseResultsChannelsItemsAlternativesItemsSummariesItems'
        topics:
          type: array
          items:
            $ref: '#/components/schemas/ListenV1ResponseResultsChannelsItemsAlternativesItemsTopicsItems'
      title: ListenV1ResponseResultsChannelsItemsAlternativesItems
    SharedSentimentsAverage:
      type: object
      properties:
        sentiment:
          type: string
        sentiment_score:
          type: number
          format: double
      title: SharedSentimentsAverage
    ListenV1ResponseMetadataTopicsInfo:
      type: object
      properties:
        model_uuid:
          type: string
        input_tokens:
          type: integer
        output_tokens:
          type: integer
      title: ListenV1ResponseMetadataTopicsInfo
    ListenV1ResponseResultsChannelsItemsAlternativesItemsEntitiesItems:
      type: object
      properties:
        label:
          type: string
        value:
          type: string
        raw_value:
          type: string
        confidence:
          type: string
          title: float
        start_word:
          type: string
          title: float
        end_word:
          type: string
          title: float
      title: ListenV1ResponseResultsChannelsItemsAlternativesItemsEntitiesItems
    V1ListenPostParametersVersion0:
      type: string
      enum:
      - latest
      description: Use the latest version of a model
      title: V1ListenPostParametersVersion0
    ListenV1ResponseResultsChannelsItemsAlternativesItemsTopicsItems:
      type: object
      properties:
        text:
          type: string
        start_word:
          type: string
          title: float
        end_word:
          type: string
          title: float
        topics:
          type: array
          items:
            type: string
      title: ListenV1ResponseResultsChannelsItemsAlternativesItemsTopicsItems
    V1ListenPostParametersCallbackMethod:
      type: string
      enum:
      - POST
      - PUT
      default: POST
      title: V1ListenPostParametersCallbackMethod
    ListenV1ResponseResultsChannelsItemsAlternativesItemsParagraphs:
      type: object
      properties:
        transcript:
          type: string
        paragraphs:
          type: array
          items:
            $ref: '#/components/schemas/ListenV1ResponseResultsChannelsItemsAlternativesItemsParagraphsParagraphsItems'
      title: ListenV1ResponseResultsChannelsItemsAlternativesItemsParagraphs
    V1ListenPostParametersRedactSchemaOneOf1Items:
      type: string
      enum:
      - pci
