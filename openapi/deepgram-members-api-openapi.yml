openapi: 3.2.0
info:
  title: REST Members API
  version: 1.0.0
servers:
- url: https://agent.deepgram.com
  description: Production
- url: https://api.deepgram.com
  description: Base
tags:
- name: Members
paths:
  /v1/projects/{project_id}/members:
    get:
      operationId: members_list
      summary: List Project Members
      description: Retrieves a list of members for a given project
      tags:
      - Members
      parameters:
      - name: project_id
        in: path
        description: The unique identifier of the project
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A list of members for a given project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProjectMembersV1Response'
        '400':
          description: Invalid Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - ApiKeyAuth: []
  /v1/projects/{project_id}/members/{member_id}:
    delete:
      operationId: members_delete
      summary: Delete a Project Member
      description: Removes a member from the project using their unique member ID
      tags:
      - Members
      parameters:
      - name: project_id
        in: path
        description: The unique identifier of the project
        required: true
        schema:
          type: string
      - name: member_id
        in: path
        description: The unique identifier of the Member
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Delete the specific member from the project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteProjectMemberV1Response'
        '400':
          description: Invalid Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - ApiKeyAuth: []
components:
  schemas:
    ErrorResponseTextError:
      type: string
      title: ErrorResponseTextError
    ErrorResponseLegacyError:
      type: object
      properties:
        err_code:
          type: string
          description: The error code
        err_msg:
          type: string
          description: The error message
        request_id:
          type: string
          description: The request ID
      title: ErrorResponseLegacyError
    ErrorResponse:
      oneOf:
      - $ref: '#/components/schemas/ErrorResponseTextError'
      - $ref: '#/components/schemas/ErrorResponseLegacyError'
      - $ref: '#/components/schemas/ErrorResponseModernError'
      title: ErrorResponse
    ErrorResponseModernError:
      type: object
      properties:
        category:
          type: string
          description: The category of the error
        message:
          type: string
          description: A message about the error
        details:
          type: string
          description: A description of the error
        request_id:
          type: string
          description: The unique identifier of the request
      title: ErrorResponseModernError
    ListProjectMembersV1Response:
      type: object
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/ListProjectMembersV1ResponseMembersItems'
      title: ListProjectMembersV1Response
    ListProjectMembersV1ResponseMembersItems:
      type: object
      properties:
        member_id:
          type: string
          description: The unique identifier of the member
        scopes:
          type: array
          items:
            type: string
          description: The API scopes of the member
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
      title: ListProjectMembersV1ResponseMembersItems
    DeleteProjectMemberV1Response:
      type: object
      properties:
        message:
          type: string
          description: confirmation message
      title: DeleteProjectMemberV1Response
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Use `Authorization: Token <API_KEY>`

        Example: `Authorization: Token 12345abcdef`

        '
    JwtAuth:
      type: http
      scheme: bearer
      description: 'Use `Authorization: Bearer <JWT>`

        Example: `Authorization: Bearer eyJhbGciOiJ...`

        '
