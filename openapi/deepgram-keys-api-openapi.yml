openapi: 3.2.0
info:
  title: REST Keys API
  version: 1.0.0
servers:
- url: https://agent.deepgram.com
  description: Production
- url: https://api.deepgram.com
  description: Base
tags:
- name: Keys
paths:
  /v1/projects/{project_id}/keys:
    get:
      operationId: keys_list
      summary: List Project Keys
      description: Retrieves all API keys associated with the specified project
      tags:
      - Keys
      parameters:
      - name: project_id
        in: path
        description: The unique identifier of the project
        required: true
        schema:
          type: string
      - name: status
        in: query
        description: Only return keys with a specific status
        required: false
        schema:
          $ref: '#/components/schemas/V1ProjectsProjectIdKeysGetParametersStatus'
      responses:
        '200':
          description: A list of API keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProjectKeysV1Response'
        '400':
          description: Invalid Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - ApiKeyAuth: []
    post:
      operationId: keys_create
      summary: Create a Project Key
      description: Creates a new API key with specified settings for the project
      tags:
      - Keys
      parameters:
      - name: project_id
        in: path
        description: The unique identifier of the project
        required: true
        schema:
          type: string
      responses:
        '200':
          description: API key created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateKeyV1Response'
        '400':
          description: Invalid Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        description: API key settings
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKeyV1Request'
      security:
      - ApiKeyAuth: []
  /v1/projects/{project_id}/keys/{key_id}:
    get:
      operationId: keys_get
      summary: Get a Project Key
      description: Retrieves information about a specified API key
      tags:
      - Keys
      parameters:
      - name: project_id
        in: path
        description: The unique identifier of the project
        required: true
        schema:
          type: string
      - name: key_id
        in: path
        description: The unique identifier of the API key
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A specific API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProjectKeyV1Response'
        '400':
          description: Invalid Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - ApiKeyAuth: []
    delete:
      operationId: keys_delete
      summary: Delete a Project Key
      description: Deletes an API key for a specific project
      tags:
      - Keys
      parameters:
      - name: project_id
        in: path
        description: The unique identifier of the project
        required: true
        schema:
          type: string
      - name: key_id
        in: path
        description: The unique identifier of the API key
        required: true
        schema:
          type: string
      responses:
        '200':
          description: API key deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteProjectKeyV1Response'
        '400':
          description: Invalid Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - ApiKeyAuth: []
components:
  schemas:
    ErrorResponseTextError:
      type: string
      title: ErrorResponseTextError
    ListProjectKeysV1Response:
      type: object
      properties:
        api_keys:
          type: array
          items:
            $ref: '#/components/schemas/ListProjectKeysV1ResponseApiKeysItems'
      title: ListProjectKeysV1Response
    ListProjectKeysV1ResponseApiKeysItemsMember:
      type: object
      properties:
        member_id:
          type: string
        email:
          type: string
      title: ListProjectKeysV1ResponseApiKeysItemsMember
    GetProjectKeyV1ResponseItem:
      type: object
      properties:
        member:
          $ref: '#/components/schemas/GetProjectKeyV1ResponseItemMember'
      title: GetProjectKeyV1ResponseItem
    CreateKeyV1Response:
      type: object
      properties:
        api_key_id:
          type: string
          description: The unique identifier of the API key
        key:
          type: string
          description: The API key
        comment:
          type: string
          description: A comment for the API key
        scopes:
          type: array
          items:
            type: string
          description: The scopes for the API key
        tags:
          type: array
          items:
            type: string
          description: The tags for the API key
        expiration_date:
          type: string
          format: date-time
          description: The expiration date of the API key
      description: API key created
      title: CreateKeyV1Response
    ListProjectKeysV1ResponseApiKeysItems:
      type: object
      properties:
        member:
          $ref: '#/components/schemas/ListProjectKeysV1ResponseApiKeysItemsMember'
        api_key:
          $ref: '#/components/schemas/ListProjectKeysV1ResponseApiKeysItemsApiKey'
      title: ListProjectKeysV1ResponseApiKeysItems
    GetProjectKeyV1ResponseItemMemberApiKey:
      type: object
      properties:
        api_key_id:
          type: string
        comment:
          type: string
        scopes:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        expiration_date:
          type: string
          format: date-time
        created:
          type: string
          format: date-time
      title: GetProjectKeyV1ResponseItemMemberApiKey
    ErrorResponseLegacyError:
      type: object
      properties:
        err_code:
          type: string
          description: The error code
        err_msg:
          type: string
          description: The error message
        request_id:
          type: string
          description: The request ID
      title: ErrorResponseLegacyError
    GetProjectKeyV1ResponseItemMember:
      type: object
      properties:
        member_id:
          type: string
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        api_key:
          $ref: '#/components/schemas/GetProjectKeyV1ResponseItemMemberApiKey'
      title: GetProjectKeyV1ResponseItemMember
    DeleteProjectKeyV1Response:
      type: object
      properties:
        message:
          type: string
      title: DeleteProjectKeyV1Response
    ListProjectKeysV1ResponseApiKeysItemsApiKey:
      type: object
      properties:
        api_key_id:
          type: string
        comment:
          type: string
        scopes:
          type: array
          items:
            type: string
        created:
          type: string
          format: date-time
      title: ListProjectKeysV1ResponseApiKeysItemsApiKey
    ErrorResponse:
      oneOf:
      - $ref: '#/components/schemas/ErrorResponseTextError'
      - $ref: '#/components/schemas/ErrorResponseLegacyError'
      - $ref: '#/components/schemas/ErrorResponseModernError'
      title: ErrorResponse
    V1ProjectsProjectIdKeysGetParametersStatus:
      type: string
      enum:
      - active
      - expired
      title: V1ProjectsProjectIdKeysGetParametersStatus
    GetProjectKeyV1Response:
      type: object
      properties:
        item:
          $ref: '#/components/schemas/GetProjectKeyV1ResponseItem'
      title: GetProjectKeyV1Response
    ErrorResponseModernError:
      type: object
      properties:
        category:
          type: string
          description: The category of the error
        message:
          type: string
          description: A message about the error
        details:
          type: string
          description: A description of the error
        request_id:
          type: string
          description: The unique identifier of the request
      title: ErrorResponseModernError
    CreateKeyV1Request:
      oneOf:
      - description: Any type
      - description: Any type
      title: CreateKeyV1Request
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Use `Authorization: Token <API_KEY>`

        Example: `Authorization: Token 12345abcdef`

        '
    JwtAuth:
      type: http
      scheme: bearer
      description: 'Use `Authorization: Bearer <JWT>`

        Example: `Authorization: Bearer eyJhbGciOiJ...`

        '
