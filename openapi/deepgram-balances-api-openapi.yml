openapi: 3.2.0
info:
  title: REST Balances API
  version: 1.0.0
servers:
- url: https://agent.deepgram.com
  description: Production
- url: https://api.deepgram.com
  description: Base
tags:
- name: Balances
paths:
  /v1/projects/{project_id}/balances:
    get:
      operationId: balances_list
      summary: Get Project Balances
      description: Generates a list of outstanding balances for the specified project
      tags:
      - Balances
      parameters:
      - name: project_id
        in: path
        description: The unique identifier of the project
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A list of outstanding balances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProjectBalancesV1Response'
        '400':
          description: Invalid Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - ApiKeyAuth: []
  /v1/projects/{project_id}/balances/{balance_id}:
    get:
      operationId: balances_get
      summary: Get a Project Balance
      description: Retrieves details about the specified balance
      tags:
      - Balances
      parameters:
      - name: project_id
        in: path
        description: The unique identifier of the project
        required: true
        schema:
          type: string
      - name: balance_id
        in: path
        description: The unique identifier of the balance
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A specific balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProjectBalanceV1Response'
        '400':
          description: Invalid Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - ApiKeyAuth: []
components:
  schemas:
    ErrorResponseTextError:
      type: string
      title: ErrorResponseTextError
    ListProjectBalancesV1ResponseBalancesItems:
      type: object
      properties:
        balance_id:
          type: string
          description: The unique identifier of the balance
        amount:
          type: number
          format: double
          default: 0
          description: The amount of the balance
        units:
          type: string
          description: The units of the balance, such as "USD"
        purchase_order_id:
          type: string
          description: Description or reference of the purchase
      title: ListProjectBalancesV1ResponseBalancesItems
    ErrorResponseLegacyError:
      type: object
      properties:
        err_code:
          type: string
          description: The error code
        err_msg:
          type: string
          description: The error message
        request_id:
          type: string
          description: The request ID
      title: ErrorResponseLegacyError
    ErrorResponse:
      oneOf:
      - $ref: '#/components/schemas/ErrorResponseTextError'
      - $ref: '#/components/schemas/ErrorResponseLegacyError'
      - $ref: '#/components/schemas/ErrorResponseModernError'
      title: ErrorResponse
    ErrorResponseModernError:
      type: object
      properties:
        category:
          type: string
          description: The category of the error
        message:
          type: string
          description: A message about the error
        details:
          type: string
          description: A description of the error
        request_id:
          type: string
          description: The unique identifier of the request
      title: ErrorResponseModernError
    GetProjectBalanceV1Response:
      type: object
      properties:
        balance_id:
          type: string
          description: The unique identifier of the balance
        amount:
          type: number
          format: double
          default: 0
          description: The amount of the balance
        units:
          type: string
          description: The units of the balance, such as "USD"
        purchase_order_id:
          type: string
          description: Description or reference of the purchase
      title: GetProjectBalanceV1Response
    ListProjectBalancesV1Response:
      type: object
      properties:
        balances:
          type: array
          items:
            $ref: '#/components/schemas/ListProjectBalancesV1ResponseBalancesItems'
      title: ListProjectBalancesV1Response
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Use `Authorization: Token <API_KEY>`

        Example: `Authorization: Token 12345abcdef`

        '
    JwtAuth:
      type: http
      scheme: bearer
      description: 'Use `Authorization: Bearer <JWT>`

        Example: `Authorization: Bearer eyJhbGciOiJ...`

        '
x-provenance:
  method: harvested
  publisher: Deepgram
  source: https://developers.deepgram.com/openapi.json
