        name:
          type: string
          description: The display name of the model
        provider:
          description: The provider of the model
      required:
      - id
      - name
      - provider
      description: Anthropic models
      title: AgentThinkModelsV1ResponseModelsItems1
    AgentThinkModelsV1ResponseModelsItemsOneOf1Id:
      type: string
