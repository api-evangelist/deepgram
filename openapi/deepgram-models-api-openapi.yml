openapi: 3.2.0
info:
  title: REST Models API
  version: 1.0.0
servers:
- url: https://agent.deepgram.com
  description: Production
- url: https://api.deepgram.com
  description: Base
tags:
- name: Models
paths:
  /v1/agent/settings/think/models:
    get:
      operationId: models_list
      summary: List Agent Think Models
      description: Retrieves the available think models that can be used for AI agent processing
      tags:
      - Models
      responses:
        '200':
          description: List of available think models
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentThinkModelsV1Response'
        '400':
          description: Invalid Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/projects/{project_id}/models:
    get:
      operationId: models_list_2
      summary: List Project Models
      description: Returns metadata on all the latest models that a specific project has access to, including non-public models
      tags:
      - Models
      parameters:
      - name: project_id
        in: path
        description: The unique identifier of the project
        required: true
        schema:
          type: string
      - name: include_outdated
        in: query
        description: returns non-latest versions of models
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: A list of models
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListModelsV1Response'
        '400':
          description: Invalid Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - ApiKeyAuth: []
  /v1/projects/{project_id}/models/{model_id}:
    get:
      operationId: models_get
      summary: Get a Project Model
      description: Returns metadata for a specific model
      tags:
      - Models
      parameters:
      - name: project_id
        in: path
        description: The unique identifier of the project
        required: true
        schema:
          type: string
      - name: model_id
        in: path
        description: The specific UUID of the model
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A model object that can be either STT or TTS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetModelV1Response'
        '400':
          description: Invalid Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - ApiKeyAuth: []
  /v1/models:
    get:
      operationId: models_list_3
      summary: List Models
      description: Returns metadata on all the latest public models. To retrieve custom models, use Get Project Models.
      tags:
      - Models
      parameters:
      - name: include_outdated
        in: query
        description: returns non-latest versions of models
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: A list of models
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListModelsV1Response'
        '400':
          description: Invalid Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - ApiKeyAuth: []
  /v1/models/{model_id}:
    get:
      operationId: models_get_2
      summary: Get a specific Model
      description: Returns metadata for a specific public model
      tags:
      - Models
      parameters:
      - name: model_id
        in: path
        description: The specific UUID of the model
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A model object that can be either STT or TTS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetModelV1Response'
        '400':
          description: Invalid Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - ApiKeyAuth: []
components:
  schemas:
    ErrorResponseTextError:
      type: string
      title: ErrorResponseTextError
    AgentThinkModelsV1ResponseModelsItems3:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/AgentThinkModelsV1ResponseModelsItemsOneOf3Id'
          description: The unique identifier of the Groq model
        name:
          type: string
          description: The display name of the model
        provider:
          description: The provider of the model
      required:
      - id
      - name
      - provider
      description: Groq models
      title: AgentThinkModelsV1ResponseModelsItems3
    ListModelsV1Response:
      type: object
      properties:
        stt:
          type: array
          items:
            $ref: '#/components/schemas/ListModelsV1ResponseSttModels'
        tts:
          type: array
          items:
            $ref: '#/components/schemas/ListModelsV1ResponseTtsModels'
      title: ListModelsV1Response
    ErrorResponse:
      oneOf:
      - $ref: '#/components/schemas/ErrorResponseTextError'
      - $ref: '#/components/schemas/ErrorResponseLegacyError'
      - $ref: '#/components/schemas/ErrorResponseModernError'
      title: ErrorResponse
    ErrorResponseModernError:
      type: object
      properties:
        category:
          type: string
          description: The category of the error
        message:
          type: string
          description: A message about the error
        details:
          type: string
          description: A description of the error
        request_id:
          type: string
          description: The unique identifier of the request
      title: ErrorResponseModernError
    AgentThinkModelsV1ResponseModelsItemsOneOf3Id:
      type: string
      enum:
      - openai/gpt-oss-20b
      description: The unique identifier of the Groq model
      title: AgentThinkModelsV1ResponseModelsItemsOneOf3Id
    GetModelV1ResponseOneOf1Metadata:
      type: object
      properties:
        accent:
          type: string
        age:
          type: string
        color:
          type: string
        image:
          type: string
          format: uri
        sample:
          type: string
          format: uri
        tags:
          type: array
          items:
            type: string
        use_cases:
          type: array
          items:
            type: string
      title: GetModelV1ResponseOneOf1Metadata
    AgentThinkModelsV1Response:
      type: object
      properties:
        models:
          type: array
          items:
            $ref: '#/components/schemas/AgentThinkModelsV1ResponseModelsItems'
      required:
      - models
      title: AgentThinkModelsV1Response
    GetModelV1Response1:
      type: object
      properties:
        name:
          type: string
        canonical_name:
          type: string
        architecture:
          type: string
        languages:
          type: array
          items:
            type: string
        version:
          type: string
        uuid:
          type: string
          format: uuid
        metadata:
          $ref: '#/components/schemas/GetModelV1ResponseOneOf1Metadata'
      title: GetModelV1Response1
    AgentThinkModelsV1ResponseModelsItems2:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/AgentThinkModelsV1ResponseModelsItemsOneOf2Id'
          description: The unique identifier of the Google model
        name:
          type: string
          description: The display name of the model
        provider:
          description: The provider of the model
      required:
      - id
      - name
      - provider
      description: Google models
      title: AgentThinkModelsV1ResponseModelsItems2
    ListModelsV1ResponseTtsModelsMetadata:
      type: object
      properties:
        accent:
          type: string
        age:
          type: string
        color:
          type: string
        image:
          type: string
