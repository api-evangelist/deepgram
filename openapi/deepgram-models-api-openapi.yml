    GetModelV1Response0:
      type: object
      properties:
        name:
          type: string
        canonical_name:
          type: string
        architecture:
          type: string
        languages:
          type: array
          items:
            type: string
        version:
          type: string
        uuid:
          type: string
          format: uuid
        batch:
          type: boolean
        streaming:
          type: boolean
        formatted_output:
          type: boolean
      title: GetModelV1Response0
    AgentThinkModelsV1ResponseModelsItems0:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/AgentThinkModelsV1ResponseModelsItemsOneOf0Id'
          description: The unique identifier of the OpenAI model
        name:
          type: string
          description: The display name of the model
        provider:
          description: The provider of the model
      required:
      - id
      - name
      - provider
      description: OpenAI models
      title: AgentThinkModelsV1ResponseModelsItems0
    GetModelV1Response:
      oneOf:
      - $ref: '#/components/schemas/GetModelV1Response0'
      - $ref: '#/components/schemas/GetModelV1Response1'
      title: GetModelV1Response
    ListModelsV1ResponseTtsModels:
      type: object
